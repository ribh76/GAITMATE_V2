name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://gaitmate:gaitmate_dev@localhost:5432/gaitmate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gaitmate
          POSTGRES_USER: gaitmate
          POSTGRES_PASSWORD: gaitmate_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaitmate -d gaitmate"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e './apps/api[dev]'
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: mypy apps/api/src
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: alembic -c apps/api/alembic.ini check
      - run: pytest apps/api/tests
      - run: python -m build --wheel apps/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

