services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gaitmate
      POSTGRES_USER: gaitmate
      POSTGRES_PASSWORD: gaitmate_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gaitmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaitmate -d gaitmate"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    profiles: [api]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gaitmate:gaitmate_dev@db:5432/gaitmate
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gaitmate_pgdata:

